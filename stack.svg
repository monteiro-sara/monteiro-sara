<svg xmlns="http://www.w3.org/2000/svg" width="760" height="84" viewBox="0 0 760 84" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">Python, Bash, Shell, C++, HTML5, CSS3, JavaScript, Git, Linux, Docker, Jupyter.</desc>

  <style>
    :root{color-scheme:light dark}

    .bg{fill:#ffffff}
    .ink{fill:#1f2328}
    .grid{stroke:#d8dee4}

    .stack-badge{
      fill:#f6f8fa;
      stroke:#d0d7de;
      stroke-width:1;
    }

    .stack-text{
      fill:#24292f;
      letter-spacing:.15px;
    }

    .stack-dot{
      fill:#2da44e;
    }

    @media(prefers-color-scheme:dark){
      .bg{fill:#0d1117}
      .ink{fill:#f0f6fc}
      .grid{stroke:#30363d}

      .stack-badge{
        fill:#161b22;
        stroke:#30363d;
      }

      .stack-text{
        fill:#e6edf3;
      }

      .stack-dot{
        fill:#3fb950;
      }
    }

    text{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace
    }
  </style>

  <rect class="bg" width="760" height="84"/>

  <text x="4" y="27" class="ink" font-size="20" font-weight="600">stack</text>
  <line x1="70" y1="20" x2="756" y2="20" class="grid" stroke-width="1"/>

  <rect x="4" y="46" width="64" height="30" rx="7" class="stack-badge"/>
  <circle cx="15" cy="61" r="2.5" class="stack-dot"/>
  <text x="41" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">Python</text>

  <rect x="74" y="46" width="56" height="30" rx="7" class="stack-badge"/>
  <circle cx="85" cy="61" r="2.5" class="stack-dot"/>
  <text x="107" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">Bash</text>

  <rect x="136" y="46" width="58" height="30" rx="7" class="stack-badge"/>
  <circle cx="147" cy="61" r="2.5" class="stack-dot"/>
  <text x="170" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">Shell</text>

  <rect x="200" y="46" width="56" height="30" rx="7" class="stack-badge"/>
  <circle cx="211" cy="61" r="2.5" class="stack-dot"/>
  <text x="233" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">C++</text>

  <rect x="262" y="46" width="58" height="30" rx="7" class="stack-badge"/>
  <circle cx="273" cy="61" r="2.5" class="stack-dot"/>
  <text x="296" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">HTML5</text>

  <rect x="326" y="46" width="56" height="30" rx="7" class="stack-badge"/>
  <circle cx="337" cy="61" r="2.5" class="stack-dot"/>
  <text x="359" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">CSS3</text>

  <rect x="388" y="46" width="94" height="30" rx="7" class="stack-badge"/>
  <circle cx="399" cy="61" r="2.5" class="stack-dot"/>
  <text x="441" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">JavaScript</text>

  <rect x="488" y="46" width="56" height="30" rx="7" class="stack-badge"/>
  <circle cx="499" cy="61" r="2.5" class="stack-dot"/>
  <text x="521" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">Git</text>

  <rect x="550" y="46" width="58" height="30" rx="7" class="stack-badge"/>
  <circle cx="561" cy="61" r="2.5" class="stack-dot"/>
  <text x="584" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">Linux</text>

  <rect x="614" y="46" width="64" height="30" rx="7" class="stack-badge"/>
  <circle cx="625" cy="61" r="2.5" class="stack-dot"/>
  <text x="651" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">Docker</text>

  <rect x="684" y="46" width="72" height="30" rx="7" class="stack-badge"/>
  <circle cx="695" cy="61" r="2.5" class="stack-dot"/>
  <text x="725" y="65" class="stack-text" font-size="10.5" font-weight="600" text-anchor="middle">Jupyter</text>
</svg>
