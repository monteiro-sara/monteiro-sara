<style>
:root{color-scheme:light dark}

.bg{fill:#fff}
.ink{fill:#1f2328}
.muted{fill:#656d76}
.grid{stroke:#d8dee4}

.stack-badge{
  fill:#f6f8fa;
  stroke:#d0d7de;
  stroke-width:1;
}

.stack-highlight{
  stroke:#ffffff;
  stroke-opacity:.75;
  stroke-width:1;
}

.stack-text{
  fill:#24292f;
  letter-spacing:.15px;
}

@media(prefers-color-scheme:dark){
  .bg{fill:#0d1117}
  .ink{fill:#f0f6fc}
  .muted{fill:#8b949e}
  .grid{stroke:#30363d}

  .stack-badge{
    fill:#161b22;
    stroke:#30363d;
  }

  .stack-highlight{
    stroke:#ffffff;
    stroke-opacity:.06;
  }

  .stack-text{
    fill:#e6edf3;
  }
}

text{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace
}
</style>
