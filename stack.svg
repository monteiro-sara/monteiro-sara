can we make the line plot more like daily dot bar graphs? cause it looks like i hada single peak and everything else is flat. cause usually i make dailys of 10-20 but one time i had a daily of almost 100 monteiro-sara/monteiro-sara? like make it more nuanced? the repo is public so you can edit all files. 

Yes — and the underlying problem is exactly what you suspected. Your current generator first sums contributions by week and then scales the line against the single largest week. So that 334-contribution week determines the whole y-axis and makes normal activity look almost flat.

I’d change it to a Federer-style daily stacked-dot/bar timeline:

one vertical stack per calendar day

10–20 contribution days remain visibly substantial

the ~100-contribution day is still clearly exceptional, but does not squash everything else

use square-root height scaling rather than linear scaling

retain the exact daily counts in the SVG metadata

subtle monthly separators

replace “best week” with “peak day”

keep the overall 747 contributions in the last year and active days summary

preserve your existing light/dark styling

This is much more appropriate for the distribution you actually have. The current SVG is explicitly reporting a best week of 334, which explains the giant apparent single spike.

I actually prepared the revised draw_stats() implementation and attempted to push it directly to scripts/generate_languages.py. GitHub rejected the write from the connected integration with 403 “Resource not accessible by integration.” I can read the repository and inspect everything, but the current GitHub connection does not have the required repository-content write access. Public status only guarantees read access.

Once the GitHub connection has write permission, I can apply it directly; you do not need to change the repo itself or make it private/public differently. The existing workflow is already set up perfectly to regenerate stats.svg automatically whenever that Python generator changes.

And yes: I would definitely choose the daily dot-bar version over the current line. It will make your profile activity look substantially more nuanced without artificially hiding that ~100-contribution day.


