<svg xmlns="http://www.w3.org/2000/svg" width="760" height="82" viewBox="0 0 760 82" role="img" aria-labelledby="title desc">
  <title id="title">Technology stack</title>
  <desc id="desc">Python, Bash, Shell, C++, HTML5, CSS3, JavaScript, Git, Linux, Docker, Jupyter.</desc>

  <style>
    :root{color-scheme:light dark}
    .bg{fill:#ffffff}
    .ink{fill:#1f2328}
    .grid{stroke:#d0d7de}
    .badge{fill:#f6f8fa;stroke:#d0d7de}
    .badge-text{fill:#24292f}

    @media(prefers-color-scheme:dark){
      .bg{fill:#0d1117}
      .ink{fill:#f0f6fc}
      .grid{stroke:#30363d}
      .badge{fill:#21262d;stroke:#30363d}
      .badge-text{fill:#f0f6fc}
    }

    text{
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace
    }
  </style>

  <rect class="bg" width="760" height="82"/>

  <text x="4" y="27" class="ink" font-size="22" font-weight="600">stack</text>
  <line x1="72" y1="20" x2="756" y2="20" class="grid" stroke-width="1"/>

  <rect class="badge" x="4" y="48" width="62" height="28"/>
  <text class="badge-text" x="35" y="66.5" font-size="11" font-weight="600" text-anchor="middle">Python</text>

  <rect class="badge" x="71" y="48" width="54" height="28"/>
  <text class="badge-text" x="98" y="66.5" font-size="11" font-weight="600" text-anchor="middle">Bash</text>

  <rect class="badge" x="130" y="48" width="56" height="28"/>
  <text class="badge-text" x="158" y="66.5" font-size="11" font-weight="600" text-anchor="middle">Shell</text>

  <rect class="badge" x="191" y="48" width="54" height="28"/>
  <text class="badge-text" x="218" y="66.5" font-size="11" font-weight="600" text-anchor="middle">C++</text>

  <rect class="badge" x="250" y="48" width="56" height="28"/>
  <text class="badge-text" x="278" y="66.5" font-size="11" font-weight="600" text-anchor="middle">HTML5</text>

  <rect class="badge" x="311" y="48" width="54" height="28"/>
  <text class="badge-text" x="338" y="66.5" font-size="11" font-weight="600" text-anchor="middle">CSS3</text>

  <rect class="badge" x="370" y="48" width="91" height="28"/>
  <text class="badge-text" x="415.5" y="66.5" font-size="11" font-weight="600" text-anchor="middle">JavaScript</text>

  <rect class="badge" x="466" y="48" width="54" height="28"/>
  <text class="badge-text" x="493" y="66.5" font-size="11" font-weight="600" text-anchor="middle">Git</text>

  <rect class="badge" x="525" y="48" width="56" height="28"/>
  <text class="badge-text" x="553" y="66.5" font-size="11" font-weight="600" text-anchor="middle">Linux</text>

  <rect class="badge" x="586" y="48" width="62" height="28"/>
  <text class="badge-text" x="617" y="66.5" font-size="11" font-weight="600" text-anchor="middle">Docker</text>

  <rect class="badge" x="653" y="48" width="70" height="28"/>
  <text class="badge-text" x="688" y="66.5" font-size="11" font-weight="600" text-anchor="middle">Jupyter</text>
</svg>
