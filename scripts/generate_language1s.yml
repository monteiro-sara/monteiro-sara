#!/usr/bin/env python3
"""Generate an SVG summarising languages across a GitHub user's public repos."""

import html
import json
import os
import sys
import urllib.request
from collections import defaultdict

API = "https://api.github.com/graphql"
WIDTH = 760
EXCLUDED = {"Jupyter Notebook"}
COLORS = {
    "Python": "#3572A5", "R": "#198CE7", "JavaScript": "#f1e05a",
    "TypeScript": "#3178c6", "Shell": "#89e051", "C": "#555555",
    "C++": "#f34b7d", "C#": "#178600", "Java": "#b07219",
    "MATLAB": "#e16737", "HTML": "#e34c26", "CSS": "#563d7c",
    "Ruby": "#701516", "Go": "#00ADD8", "Rust": "#dea584",
    "Julia": "#a270ba", "TeX": "#3D6117", "PHP": "#4F5D95",
    "Swift": "#F05138", "Kotlin": "#A97BFF", "Dart": "#00B4AB",
    "PowerShell": "#012456",
}
QUERY = """
query($login: String!, $after: String) {
  user(login: $login) {
    repositories(first: 100, after: $after, ownerAffiliations: OWNER,
                 isFork: false, privacy: PUBLIC,
                 orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes {
        languages(first: 30, orderBy: {field: SIZE, direction: DESC}) {
          edges { size node { name color } }
        }
      }
    }
  }
}
"""


def graphql(token, variables):
    body = json.dumps({"query": QUERY, "variables": variables}).encode()
    request = urllib.request.Request(
        API, data=body,
        headers={"Authorization": f"bearer {token}",
                 "Content-Type": "application/json",
                 "User-Agent": "profile-language-card"})
    with urllib.request.urlopen(request, timeout=30) as response:
        payload = json.load(response)
    if payload.get("errors"):
        raise RuntimeError(payload["errors"])
    return payload["data"]["user"]["repositories"]


def collect(login, token):
    totals, repo_counts, api_colors = defaultdict(int), defaultdict(int), {}
    after = None
    while True:
        page = graphql(token, {"login": login, "after": after})
        for repository in page["nodes"]:
            seen = set()
            for edge in (repository.get("languages") or {}).get("edges") or []:
                name = edge["node"]["name"]
                if name in EXCLUDED:
                    continue
                totals[name] += int(edge["size"])
                if edge["node"].get("color"):
                    api_colors[name] = edge["node"]["color"]
                seen.add(name)
            for name in seen:
                repo_counts[name] += 1
        if not page["pageInfo"]["hasNextPage"]:
            break
        after = page["pageInfo"]["endCursor"]
    return totals, repo_counts, api_colors


def fmt_bytes(value):
    amount = float(value)
    for unit in ("B", "KB", "MB", "GB"):
        if amount < 1000 or unit == "GB":
            return f"{amount:.0f} {unit}" if amount >= 10 else f"{amount:.1f} {unit}"
        amount /= 1000


def render(login, totals, repo_counts, api_colors):
    ranked = sorted(totals, key=lambda n: (-totals[n], n.lower()))[:10]
    total_bytes = sum(totals.values()) or 1
    height = 116 + max(1, len(ranked)) * 42
    out = [
        f'<svg xmlns="http://www.w3.org/2000/svg" width="{WIDTH}" height="{height}" viewBox="0 0 {WIDTH} {height}" role="img" aria-labelledby="title desc">',
        f'<title id="title">Programming languages used by {html.escape(login)}</title>',
        '<desc id="desc">Languages in public non-fork repositories, ranked by GitHub Linguist byte totals.</desc>',
        '<style>:root{color-scheme:light dark}.bg{fill:#fff}.title{fill:#1f2328}.muted{fill:#656d76}.track{fill:#eaeef2}.rule{stroke:#d0d7de}text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}@media(prefers-color-scheme:dark){.bg{fill:#0d1117}.title{fill:#f0f6fc}.muted{fill:#8b949e}.track{fill:#21262d}.rule{stroke:#30363d}}</style>',
        f'<rect class="bg" width="{WIDTH}" height="{height}" rx="12"/>',
        '<text x="28" y="34" class="title" font-size="17" font-weight="700">LANGUAGES USED</text>',
        '<text x="28" y="57" class="muted" font-size="11">public · owned · non-fork repositories</text>',
        '<text x="732" y="57" class="muted" font-size="10" text-anchor="end">BY CODE VOLUME</text>',
        '<line x1="28" y1="70" x2="732" y2="70" class="rule"/>']

    if not ranked:
        out.append('<text x="28" y="112" class="muted" font-size="13">No language data found yet.</text>')
    else:
        bar_x, bar_w = 220, 348
        for index, name in enumerate(ranked):
            y = 94 + index * 42
            value = totals[name]
            share = value / total_bytes * 100
            color = COLORS.get(name, api_colors.get(name) or "#8b949e")
            count = repo_counts[name]
            word = "repo" if count == 1 else "repos"
            visible_w = max(3.0, bar_w * share / 100)
            out.extend([
                f'<text x="28" y="{y + 5}" class="title" font-size="12" font-weight="600">{html.escape(name)}</text>',
                f'<rect x="{bar_x}" y="{y - 7}" width="{bar_w}" height="12" rx="6" class="track"/>',
                f'<rect x="{bar_x}" y="{y - 7}" width="{visible_w:.1f}" height="12" rx="6" fill="{html.escape(color)}"/>',
                f'<text x="586" y="{y + 4}" class="title" font-size="11">{share:.1f}%</text>',
                f'<text x="732" y="{y + 4}" class="muted" font-size="10" text-anchor="end">{count} {word} · {fmt_bytes(value)}</text>'])

    out.extend([
        f'<text x="28" y="{height - 16}" class="muted" font-size="9">GitHub Linguist data · Jupyter Notebook excluded as a container format · updated daily</text>',
        '</svg>'])
    return "".join(out)


def main():
    token, login = os.environ.get("GITHUB_TOKEN"), os.environ.get("GH_LOGIN")
    output = os.environ.get("OUT_FILE", "languages.svg")
    if not token or not login:
        sys.exit("GITHUB_TOKEN and GH_LOGIN are required")
    totals, repo_counts, api_colors = collect(login, token)
    svg = render(login, totals, repo_counts, api_colors)
    previous = ""
    if os.path.exists(output):
        with open(output, encoding="utf-8") as handle:
            previous = handle.read()
    if svg != previous:
        with open(output, "w", encoding="utf-8") as handle:
            handle.write(svg)
        print(f"updated {output} with {len(totals)} languages")
    else:
        print("no language changes")


if __name__ == "__main__":
    main()
