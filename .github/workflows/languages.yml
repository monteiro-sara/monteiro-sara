name: Refresh language profile

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_languages.py"
      - ".github/workflows/languages.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile-languages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate profile graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_languages.py

      - name: Commit updated card
        run: |
          if git diff --quiet -- stats.svg languages.svg; then
            echo "No profile-stat changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg languages.svg
          git commit -m "stats: refresh profile graphics"
          git push
